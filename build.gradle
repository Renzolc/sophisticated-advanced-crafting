plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
// Jar file name replaces '+' so the file is sophisticated_advanced_crafting-1.0.6-mcV.jar.
base.archivesName = mod_id
tasks.named('jar', Jar).configure {
    archiveVersion = mod_version.replace('+', '-')
    exclude 'dev/renzo/sophisticatedadvancedcrafting/devcheck/**'
}
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = uri("https://api.modrinth.com/maven") }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Dev-run source set. Declared before neoForge so runs can load it. Classpath is attached below.
sourceSets {
    devcheck {
        java {
            srcDir 'src/devcheck/java'
        }
    }
}

neoForge {
    version = project.neo_version

    // Minecraft 26.x is unobfuscated, so there are no Parchment mappings.

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.disableRefMap', 'true'
            systemProperty 'mixin.debug.verify', 'true'
            systemProperty 'mixin.checks.interfaces', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devcheck)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Required at runtime. Backpacks and storage are optional at runtime but needed to compile compat.
    implementation "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    implementation "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    implementation "maven.modrinth:sophisticated-storage:${sophisticated_storage_version}"
}

sourceSets.devcheck.compileClasspath += sourceSets.main.compileClasspath
sourceSets.devcheck.compileClasspath += sourceSets.main.output
sourceSets.devcheck.runtimeClasspath += sourceSets.main.runtimeClasspath
sourceSets.devcheck.runtimeClasspath += sourceSets.main.output

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
